<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heardle Unlimited - Multijoueur</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- PeerJS for WebRTC P2P multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        if (typeof Peer === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"><\/script>');
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            width: 100%;
            background: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .hidden {
            display: none !important;
        }

        .game-container {
            width: 100%;
            min-height: 100vh;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header matching index.html exactly */
        .game-header {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 16px 36px;
            border-bottom: 1px solid #282828;
            background: #121212;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-self: start;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-self: end;
            grid-column: 3;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
            grid-column: 2;
            justify-self: center;
        }

        .game-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin: 0;
            white-space: nowrap;
        }

        .header-badge {
            background: #1db954;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-action-btn {
            background: #282828;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .header-action-btn:hover {
            border-color: #1db954;
            color: #1db954;
            background: #333;
        }

        .connection-status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-dot.online {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .connection-dot.offline {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        /* Dynamic Main Area */
        #mpDynamicArea {
            width: 100%;
            max-width: 680px;
            padding: 24px 16px 60px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* Hub & Lobby Cards */
        .mp-hub-card,
        .mp-lobby-card,
        .mp-round-over-card {
            background: #181818;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 28px 24px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mp-hub-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .mp-hub-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .mp-hub-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .mp-hub-header p {
            font-size: 13.5px;
            color: #888;
            line-height: 1.4;
        }

        /* Profile Box */
        .mp-player-profile-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px 18px;
            margin-bottom: 22px;
        }

        .mp-player-profile-box label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #888;
            margin-bottom: 8px;
        }

        .mp-profile-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mp-avatar-selector {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #282828;
            border: 1.5px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .mp-avatar-selector:hover {
            border-color: #1db954;
        }

        .avatar-edit-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            width: 16px;
            height: 16px;
            background: #1db954;
            color: #000;
            border-radius: 50%;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar-dropdown {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            background: #121212;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .avatar-btn {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 20px;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.15s;
        }

        .avatar-btn:hover,
        .avatar-btn.selected {
            background: #282828;
            border-color: #1db954;
        }

        .mp-input {
            flex: 1;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .mp-input:focus {
            border-color: #1db954;
        }

        .mp-input.code-input {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Tabs */
        .mp-hub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 1px solid #282828;
            padding-bottom: 10px;
        }

        .mp-tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .mp-tab-btn:hover {
            color: #fff;
            background: #1e1e1e;
        }

        .mp-tab-btn.active {
            color: #1db954;
            background: #1e1e1e;
        }

        .mp-form-group {
            margin-bottom: 16px;
        }

        .mp-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
        }

        .mp-select {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            padding: 10px 12px;
            font-size: 13.5px;
            outline: none;
            cursor: pointer;
        }

        .mp-select:focus {
            border-color: #1db954;
        }

        .mp-action-btn {
            width: 100%;
            padding: 13px 18px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mp-action-btn.primary {
            background: #1db954;
            color: #000;
        }

        .mp-action-btn.primary:hover {
            background: #1ed760;
            transform: scale(1.01);
        }

        .mp-action-btn.secondary {
            background: #282828;
            color: #fff;
            border: 1px solid #444;
        }

        .mp-action-btn.secondary:hover {
            background: #333;
            border-color: #555;
        }

        .mp-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Lobby Header */
        .mp-lobby-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .room-code-badge {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 24px;
            margin-bottom: 12px;
        }

        .room-code-badge .label {
            font-size: 10px;
            font-weight: 700;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .room-code-badge .code {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #1db954;
        }

        .share-link-row {
            display: flex;
            gap: 8px;
            max-width: 480px;
            margin: 0 auto;
        }

        .mp-share-url-input {
            flex: 1;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            color: #888;
            padding: 8px 12px;
            font-size: 12px;
            outline: none;
        }

        .mp-copy-btn {
            background: #282828;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .mp-copy-btn:hover {
            border-color: #1db954;
            color: #1db954;
        }

        .mp-lobby-settings-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .settings-col .setting-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .settings-col .setting-val {
            font-size: 13.5px;
            font-weight: 600;
            color: #fff;
        }

        .mp-players-section {
            margin-bottom: 24px;
        }

        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-header-row h3 {
            font-size: 14px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-count-pill {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: #1db954;
        }

        .mp-players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .mp-player-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            font-size: 22px;
        }

        .player-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .host-crown {
            color: #f59e0b;
            font-size: 11px;
            margin-left: 4px;
        }

        .mp-lobby-actions {
            display: flex;
            gap: 10px;
        }

        /* Game Arena Layout */
        .mp-gameplay-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mp-gameplay-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }

        .mp-round-badge {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            margin-bottom: 12px;
        }

        .mp-round-badge .highlight {
            color: #1db954;
        }

        /* Circular Timer */
        .circular-timer-container {
            position: relative;
            width: 84px;
            height: 84px;
            margin-bottom: 8px;
        }

        .circular-timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-bg-circle {
            fill: none;
            stroke: #282828;
            stroke-width: 6;
        }

        .timer-progress-circle {
            fill: none;
            stroke: #1db954;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
        }

        .timer-progress-circle.urgent-pulse {
            animation: urgentPulse 0.5s infinite alternate;
        }

        @keyframes urgentPulse {
            from { stroke-width: 6; }
            to { stroke-width: 8; }
        }

        .timer-text-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-number {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }

        .timer-unit {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: #888;
            margin-top: 1px;
        }

        .mp-scoring-info-tip {
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        /* Split Arena: Player board + Live leaderboard */
        .mp-game-arena {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 680px) {
            .mp-game-arena {
                grid-template-columns: 1fr;
            }
            .game-header {
                padding: 12px 16px;
            }
        }

        .mp-player-board {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mp-game-stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }

        .mp-answer-boxes {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .answer-box {
            height: 42px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 14px;
            font-size: 13.5px;
            font-weight: 600;
            color: #fff;
            transition: all 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .answer-box.current {
            border-color: #fff;
            background: #282828;
        }

        .answer-box.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .answer-box.incorrect {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }

        .answer-box.skipped {
            border-color: #555;
            background: #252525;
            color: #888;
        }

        .attempt-number {
            color: #666;
            font-size: 12px;
        }

        .instruction-text {
            color: #888;
            font-size: 13px;
            margin-bottom: 14px;
            text-align: center;
        }

        /* Audio Player matching index.html */
        .audio-player {
            width: 100%;
            margin-bottom: 16px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #282828;
            border-radius: 3px;
            margin-bottom: 8px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #1db954;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 14px;
        }

        .play-button {
            width: 58px;
            height: 58px;
            background: none;
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 auto 12px;
            transition: all 0.2s;
        }

        .play-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        /* Search input matching index.html */
        .search-container {
            width: 100%;
            margin-bottom: 12px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            background: #222;
            border: 2px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #1db954;
        }

        .clear-button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            font-size: 15px;
            cursor: pointer;
            padding: 4px;
        }

        .autocomplete-dropdown {
            position: absolute;
            bottom: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5);
        }

        .autocomplete-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid #282828;
            transition: background 0.15s;
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: #282828;
        }

        .autocomplete-item-icon {
            font-size: 16px;
        }

        .autocomplete-item-info {
            flex: 1;
            min-width: 0;
        }

        .autocomplete-item-title {
            font-size: 13.5px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .autocomplete-item-artist {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .autocomplete-highlight {
            color: #1db954;
            font-weight: 700;
        }

        .autocomplete-no-results {
            padding: 12px;
            color: #888;
            font-size: 13px;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .action-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .skip-button {
            background: #282828;
            color: #fff;
            border: 1px solid #444;
        }

        .skip-button:hover {
            background: #333;
            border-color: #555;
        }

        .submit-button {
            background: #1db954;
            color: #000;
        }

        .submit-button:hover {
            background: #1ed760;
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mp-solved-banner {
            width: 100%;
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid #2ecc71;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mp-solved-banner .solved-icon { font-size: 24px; }
        .mp-solved-banner h4 { font-size: 14px; font-weight: 700; color: #2ecc71; }
        .mp-solved-banner p { font-size: 12px; color: #bbb; margin: 0; }

        /* Live Scoreboard Sidebar */
        .mp-live-scoreboard {
            background: #181818;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 14px;
        }

        .scoreboard-header h4 {
            font-size: 11px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            border-bottom: 1px solid #282828;
            padding-bottom: 6px;
        }

        .scoreboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mp-score-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            background: #1e1e1e;
            border: 1px solid #282828;
            font-size: 12px;
        }

        .mp-score-row.me {
            border-color: #1db954;
            background: rgba(29, 185, 84, 0.08);
        }

        .score-rank { font-weight: 700; color: #888; width: 18px; }
        .score-avatar { font-size: 16px; }
        .score-details { flex: 1; min-width: 0; }
        .score-name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .score-player-name { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
        .score-sub-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .score-points { font-weight: 700; color: #1db954; }

        .status-tag {
            font-size: 9.5px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .status-tag.correct { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .status-tag.failed { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .status-tag.skipped { background: #333; color: #aaa; }
        .status-tag.listening { background: #282828; color: #888; }

        /* Round Over Reveal */
        .round-over-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .round-over-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .round-winner-line {
            font-size: 13.5px;
            color: #888;
        }

        .round-winner-line strong {
            color: #1db954;
        }

        .mp-song-reveal-box {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
        }

        .reveal-cover {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
        }

        .reveal-label {
            font-size: 10px;
            font-weight: 700;
            color: #888;
            letter-spacing: 0.5px;
        }

        .reveal-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin: 2px 0;
        }

        .reveal-artist {
            font-size: 13px;
            color: #888;
        }

        .reveal-audio-player {
            margin-bottom: 20px;
        }

        .reveal-play-btn {
            width: 100%;
            padding: 10px 16px;
            background: #282828;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reveal-play-btn:hover {
            border-color: #1db954;
            color: #1db954;
        }

        .mp-scoreboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .mp-scoreboard-table th {
            text-align: left;
            padding: 8px 10px;
            color: #888;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid #282828;
        }

        .mp-scoreboard-table td {
            padding: 9px 10px;
            border-bottom: 1px solid #222;
        }

        .mp-scoreboard-table tr.highlight-row {
            background: rgba(29, 185, 84, 0.08);
        }

        .mp-round-over-footer {
            display: flex;
            justify-content: center;
        }

        .waiting-host-msg {
            color: #888;
            font-size: 13.5px;
            font-style: italic;
        }

        /* Toast Notifications */
        .mp-toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .mp-toast {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            animation: popToast 0.2s ease-out;
        }

        .mp-toast.success { border-color: #10b981; color: #10b981; }
        .mp-toast.error { border-color: #ef4444; color: #ef4444; }

        @keyframes popToast {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <!-- Persistent Global Audio Host for YouTube iframe API -->
    <div id="globalAudioContainer" style="position: fixed; bottom: 0; right: 0; width: 160px; height: 120px; opacity: 0.01; pointer-events: none; z-index: -1; overflow: hidden;">
        <div id="gameAudio"></div>
    </div>

    <div class="game-container">
        <!-- Header matching index.html -->
        <header class="game-header">
            <div class="header-left">
                <button type="button" class="header-action-btn" id="btnReturnSolo" title="Retourner au mode Solo">
                    ⬅ Mode Solo
                </button>
            </div>

            <div class="header-center">
                <h1 class="game-title">Heardle Unlimited</h1>
                <span class="header-badge">Multijoueur</span>
            </div>

            <div class="header-right">
                <div class="connection-status-pill">
                    <span class="connection-dot online" id="mpConnectionDot"></span>
                    <span id="mpConnectionText">En ligne</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Game Arena -->
        <main id="mpDynamicArea">
            <!-- Hub, Lobby, In-Game Arena or Round Over is injected here -->
        </main>
    </div>

    <!-- YouTube Config -->
    <script src="config.js"></script>
    <!-- Playlists Data Fallback -->
    <script src="playlists.js"></script>
    <!-- Multiplayer Logic Engine -->
    <script src="multiplayer.js"></script>
</body>

</html>
